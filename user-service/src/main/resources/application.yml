server:
  port: 8081

spring:
  boot:
    admin:
      client:
        url: http://localhost:8088 # Admin Server 주소 (예: 포트 8088)

  application:
    name: user-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
#  profiles:
#    active: dev
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
      password: $2a$10$g70rRcQBR7Jnm9A9m/Nqje8lCIPeADz2.VBMxhPyzUBoJc28pvC9.

logging:
  level:
    org.springframework.security: DEBUG
    com.example.userservice: DEBUG
  pattern:
    level: "%5p [${spring.application.name},traceId=%X{traceId},spanId=%X{spanId}]"
    console:  >
      {"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}",
       "level":"%p",
       "thread":"%t",
       "logger":"%c",
       "message":"%m",
       "traceId":"%X{traceId}",
       "spanId":"%X{spanId}"}%n


eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    fetch-registry: true
    register-with-eureka: true

greeting:
  message: Welcome to the Simple E-commerce. (spring boot)

token:
  expiration-time: 86400000 #10 days
  secret: my-very-long-secret-key-1234567890123456

order-service:
  url: http://order-service/order-service/%s/orders

management:
  tracing:
    sampling:
      probability: 1.0      # 1.0이면 100% 샘플링 (개발/테스트 환경에서 유용)
  propagation:
    consume: w3c
    produce: w3c
    otlp:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans   # Zipkin HTTP endpoint 사용
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - busrefresh
          - env
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
