apiVersion: v1
kind: Service
metadata:
  name: catalog-service-svc
spec:
  type: NodePort
  selector:
    app: catalog-service     # 연결할 Pod의 labels(app: catalog-service  )와 일치해야 함
  ports:
    - protocol: TCP
      port: 8080             # 클러스터 내부에서 사용하는 서비스 포트
      targetPort: 8080       # Pod 컨테이너 내부 포트 (catalog-service 기본 포트)
      nodePort: 32080        # 외부(웹 브라우저)에서 접근할 노드 포트 (30000~32767 사이 지정)