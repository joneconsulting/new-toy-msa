server:
  port: 8080
spring:
  application:
    name: my-first-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0      # 1.0이면 100% 샘플링 (개발/테스트 환경에서 유용)
    propagation:
      consume: w3c
      produce: w3c
#  otlp:
#    tracing:
#      endpoint: http://localhost:4318/v1/traces   # Zipkin HTTP endpoint 사용
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
logging:
  pattern:
    level: "%5p [${spring.application.name},traceId=%X{traceId},spanId=%X{spanId}]"
