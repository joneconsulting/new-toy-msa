apiVersion: v1
kind: Service
metadata:
  name: order-service-svc
spec:
  type: NodePort
  selector:
    app: order-service     # 연결할 Pod의 labels(app: user-service  )와 일치해야 함
  ports:
    - protocol: TCP
      port: 8082             # 클러스터 내부에서 사용하는 서비스 포트
      targetPort: 8082       # Pod 컨테이너 내부 포트 (order-service 기본 포트)
      nodePort: 32082        # 외부(웹 브라우저)에서 접근할 노드 포트 (30000~32767 사이 지정)